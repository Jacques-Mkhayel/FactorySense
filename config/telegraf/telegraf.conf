# FactorySense ingestor: MQTT -> TimescaleDB, configuration only.
# ${VAR} placeholders are resolved by Telegraf from the container environment.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  skip_processors_after_aggregators = true

# Subscribes to plant telemetry with the ingestor's own broker credentials.
[[inputs.mqtt_consumer]]
  servers = ["ssl://${MQTT_HOST}:${MQTT_PORT}"]
  tls_ca = "${MQTT_CA_FILE}"
  topics = ["factorysense/telemetry/#"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "factorysense-ingestor"
  qos = 1
  # Persistent session: the broker queues messages for us if Telegraf restarts.
  persistent_session = true
  name_override = "telemetry"
  # The topic is already encoded in site_id/machine_id; storing it would add a redundant column.
  topic_tag = ""
  # Payload contract with the edge gateway (finalise in phase 2).
  # Taking the timestamp from the payload, not arrival time, is what lets buffered
  # data be backfilled with its original timestamps after a WAN outage (demo 4).
  data_format = "json"
  tag_keys = ["site_id", "machine_id"]
  json_time_key = "ts"
  json_time_format = "unix_ms"

# Writes into the `telemetry` hypertable created by config/timescaledb/init/010-telemetry.sh.
[[outputs.postgresql]]
  # TODO(phase 2): a dedicated insert-only role instead of the database owner.
  connection = "host=${POSTGRES_HOST} port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
  # Tags as plain text columns, matching the table definition.
  tags_as_foreign_keys = false

# Exposes :8080 for the container healthcheck.
[[outputs.health]]
  service_address = "http://:8080"
