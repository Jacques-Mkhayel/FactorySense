# FactorySense ingestor: MQTT -> validation -> TimescaleDB.
# Environment supplies credentials; the processor defines the telemetry contract.
[agent]
  interval = "10s"
  flush_interval = "5s"
  metric_batch_size = 100
  metric_buffer_limit = 10000
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.mqtt_consumer]]
  servers = ["ssl://${MQTT_HOST}:${MQTT_PORT}"]
  tls_ca = "${MQTT_CA_FILE}"
  insecure_skip_verify = false
  topics = ["factorysense/telemetry/#"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  client_id = "factorysense-ingestor"
  qos = 1
  persistent_session = true
  connection_timeout = "5s"
  max_reconnect_interval = "30s"
  # Below the output buffer capacity: stop accepting more until outputs catch up.
  max_undelivered_messages = 500
  name_override = "telemetry"
  # Used for identity validation, then removed before the database write.
  topic_tag = "mqtt_topic"
  # Decode in Starlark to require all fields and reject invalid timestamps instead
  # of falling back to arrival time. One MQTT message becomes one metric.
  data_format = "value"
  data_type = "string"

[[processors.starlark]]
  namepass = ["telemetry"]
  script = "/etc/telegraf/telemetry.star"

[[outputs.postgresql]]
  namepass = ["telemetry"]
  # PGHOST, PGUSER, PGPASSWORD and PGDATABASE are read by the PostgreSQL driver.
  # Keeping credentials out of this string also handles quotes/spaces in passwords.
  connection = "sslmode=disable connect_timeout=5"
  schema = "public"
  tags_as_foreign_keys = false
  timestamp_column_name = "time"
  timestamp_column_type = "timestamp with time zone"
  # The init SQL owns the schema. Incoming JSON must never create tables/columns.
  create_templates = []
  add_column_templates = []

# Process liveness only: this endpoint is not proof of a successful DB insert.
[[outputs.health]]
  service_address = "http://127.0.0.1:8080"
