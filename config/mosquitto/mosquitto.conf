# FactorySense broker.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Credentials and ACL are global; only anonymous access differs per listener.
password_file /tmp/mosquitto/passwd
acl_file /tmp/mosquitto/acl

# Devices and cloud services: TLS only, every client authenticates and is confined by the ACL.
# There is no plaintext listener on the network. Certificates come from the mqtt-certs job.
listener 8883
listener_allow_anonymous false
certfile /mosquitto/tls/server.crt
keyfile /tmp/mosquitto/server.key
tls_version tlsv1.2

# Container-local listener for the healthcheck only: anonymous, read-only on the uptime topic.
listener 1880 127.0.0.1
listener_allow_anonymous true
